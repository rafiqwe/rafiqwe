<style><![CDATA[

  :root { color-scheme: dark; }
  .display { font-family: "Arial Black", "Segoe UI", Arial, sans-serif; font-weight: 900; letter-spacing: -1px; }
  .sans { font-family: "Segoe UI", Arial, sans-serif; }
