  .slide { opacity:0; animation: slides 12s linear infinite; }
  .slide.s1 { opacity:1; }
  .s1{animation-delay:0s}.s2{animation-delay:4s}.s3{animation-delay:8s}
  @keyframes slides { 0%{opacity:0;transform:translateY(8px)} 8%,25%{opacity:1;transform:translateY(0)} 31%,100%{opacity:0;transform:translateY(-6px)} }
  .prog { transform-origin:left center; animation: prog 4s linear infinite; }
  .p2{animation-delay:4s}.p3{animation-delay:8s}
  @keyframes prog { 0%{transform:scaleX(0);opacity:.9} 90%{transform:scaleX(1);opacity:.9} 100%{transform:scaleX(1);opacity:0} }
  .cap { animation: capIn .7s ease both; }
  .c2{animation-delay:.1s}.c3{animation-delay:.2s}.c4{animation-delay:.3s}.c5{animation-delay:.4s}.c6{animation-delay:.5s}
  @keyframes capIn { from{opacity:0;transform:translateX(-12px)} to{opacity:1;transform:none} }
  @media (prefers-reduced-motion: reduce){.slide{opacity:0!important}.s1{opacity:1!important}.prog{transform:scaleX(1)!important}.cap{opacity:1!important;transform:none!important}}

]]></style>

