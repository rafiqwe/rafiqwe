<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 770" role="img" aria-label="Muhammad Rabbi GitHub profile graphic">
<defs>
  <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#247bff"/><stop offset="1" stop-color="#ff354f"/></linearGradient>
  <linearGradient id="soft" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#247bff" stop-opacity=".20"/><stop offset="1" stop-color="#ff354f" stop-opacity=".12"/></linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  
</defs>
<style><![CDATA[

  :root { color-scheme: dark; }
  .display { font-family: "Arial Black", "Segoe UI", Arial, sans-serif; font-weight: 900; letter-spacing: -1px; }
  .sans { font-family: "Segoe UI", Arial, sans-serif; }
  .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
  .muted { fill: #8ea0bb; }
  .white { fill: #f3f6fb; }
  .blue { fill: #247bff; }
  .red { fill: #ff354f; }
  .hair { stroke: url(#hair); stroke-width: 1.2; fill: none; }
  .dot { fill: #247bff; opacity: .34; }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
    .motion-hide { display:none !important; }
  }


  .dash1 { stroke-dasharray:10 12; animation: dash 18s linear infinite; }
  .dash2 { stroke-dasharray:6 14; animation: dash2 24s linear infinite; }
  @keyframes dash { to { stroke-dashoffset:-240; } }
  @keyframes dash2 { to { stroke-dashoffset:260; } }
  .node { animation: nodePulse 5s ease-in-out infinite; }
  @keyframes nodePulse { 0%,100%{opacity:.88} 50%{opacity:1} }

]]></style>

<rect width="1200" height="770" rx="32" fill="#070b16"/>
